apiVersion: apps/v1
kind: Deployment
metadata: 
  name: typebot-builder-deployment # donest connect to anything (for kubectl)
  labels: 
    app: typebot-builder
spec:
  replicas: 2
  selector: 
    matchLabels: 
      app: typebot-builder # 
  template: 
    metadata: 
      labels: 
        app: typebot-builder # 
    spec: 
      containers:
      - name: typebot-builder
        image:  baptistearno/typebot-builder:latest
        ports:
        - containerPort: 3000
        envFrom: 
          - configMapRef:
              name: typebot-config
          - secretRef: 
              name: typebot-secret
        env:
         - name: DATABASE_URL
           valueFrom:
            secretKeyRef:
              name: postgres-cluster-app
              key: uri
